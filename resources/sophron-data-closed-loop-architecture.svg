<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920" role="img" aria-labelledby="title desc">
  <title id="title">九思助理数据闭环架构图</title>
  <desc id="desc">FineBI Next 云端、本地九思助理、LLM 服务调用、工具集、本地数据源、数据处理流程和标准二维表写回的闭环结构。</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>
    <linearGradient id="greenPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6fff9"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <style>
      .font{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}
      .title{font-size:30px;font-weight:800;fill:#0f172a}
      .h2{font-size:22px;font-weight:800;fill:#0f172a}
      .h3{font-size:17px;font-weight:750;fill:#0f172a}
      .body{font-size:14px;fill:#334155}
      .small{font-size:12px;fill:#475569}
      .tiny{font-size:11px;fill:#64748b}
      .blue{fill:#2563eb}.green{fill:#15803d}.purple{fill:#6d28d9}.orange{fill:#ea580c}
      .box{fill:url(#panel);stroke:#bfdbfe;stroke-width:1.5;rx:14}
      .greenBox{fill:url(#greenPanel);stroke:#22c55e;stroke-width:1.5;rx:14}
      .purpleBox{fill:#fbf8ff;stroke:#8b5cf6;stroke-width:1.5;rx:14}
      .orangeBox{fill:#fffaf4;stroke:#fb923c;stroke-width:1.5;rx:14}
      .dash{fill:#ffffff;stroke:#2563eb;stroke-width:1.7;stroke-dasharray:8 7;rx:16}
      .blueLine{stroke:#2563eb;stroke-width:2.4;fill:none;marker-end:url(#blueArrow)}
      .greenLine{stroke:#16a34a;stroke-width:2.4;fill:none;marker-end:url(#greenArrow)}
      .plainLine{stroke:#475569;stroke-width:1.7;fill:none}
    </style>
  </defs>
  <rect width="1500" height="920" fill="#fbfdff"/>
  <g class="font">
    <rect x="18" y="16" width="292" height="720" class="box" filter="url(#shadow)"/>
    <text x="66" y="56" class="h2 blue">FineBI Next（云端）</text>
    <text x="66" y="84" class="body">企业级数据分析与应用平台</text>
    <text x="38" y="58" font-size="32" fill="#2563eb">☁</text>

    <rect x="34" y="112" width="260" height="116" class="box"/>
    <text x="130" y="142" class="h3 blue">数据资产</text>
    <text x="54" y="178" font-size="25" fill="#2563eb">▦</text><text x="52" y="204" class="small">数据集</text>
    <text x="116" y="178" font-size="25" fill="#2563eb">▦</text><text x="112" y="204" class="small">数据表</text>
    <text x="178" y="178" font-size="25" fill="#2563eb">▥</text><text x="178" y="204" class="small">指标</text>
    <text x="238" y="178" font-size="25" fill="#2563eb">⌘</text><text x="222" y="204" class="small">主题模型</text>

    <rect x="34" y="248" width="260" height="116" class="box"/>
    <text x="130" y="278" class="h3 blue">分析与应用</text>
    <text x="54" y="314" font-size="25" fill="#2563eb">▧</text><text x="44" y="340" class="small">自助分析</text>
    <text x="116" y="314" font-size="25" fill="#2563eb">▧</text><text x="112" y="340" class="small">看板</text>
    <text x="178" y="314" font-size="25" fill="#2563eb">▤</text><text x="164" y="340" class="small">仪表板</text>
    <text x="238" y="314" font-size="25" fill="#2563eb">▥</text><text x="232" y="340" class="small">报表</text>

    <rect x="34" y="384" width="260" height="116" class="box"/>
    <text x="130" y="414" class="h3 blue">平台能力</text>
    <text x="54" y="450" font-size="25" fill="#2563eb">▣</text><text x="44" y="476" class="small">权限管理</text>
    <text x="116" y="450" font-size="25" fill="#2563eb">▤</text><text x="106" y="476" class="small">数据服务</text>
    <text x="178" y="450" font-size="25" fill="#2563eb">◫</text><text x="166" y="476" class="small">调度任务</text>
    <text x="238" y="450" font-size="25" fill="#2563eb">⌘</text><text x="226" y="476" class="small">协作发布</text>

    <rect x="34" y="520" width="260" height="176" class="box"/>
    <text x="101" y="550" class="h3 blue">个人 API（开放平台）</text>
    <text x="64" y="586" class="small">• 认证授权（Token）</text>
    <text x="64" y="616" class="small">• 数据读取 API</text>
    <text x="64" y="646" class="small">• 数据写入 API</text>
    <text x="64" y="676" class="small">• 元数据 / 数据集管理 API</text>
    <text x="42" y="578" font-size="30" fill="#2563eb">API</text>

    <rect x="388" y="16" width="806" height="738" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4" rx="14"/>
    <text x="404" y="54" class="h2">本地环境（Local）</text>
    <text x="588" y="72" class="title">九思助理（sophron cowork）</text>
    <text x="690" y="102" class="body">本地桌面客户端，编排工具调用与数据处理</text>
    <text x="548" y="77" font-size="45" fill="#6d28d9">☷</text>

    <rect x="430" y="126" width="636" height="94" class="purpleBox"/>
    <text x="724" y="154" class="h3 purple">用户交互</text>
    <text x="486" y="202" class="small">自然语言查询</text>
    <text x="646" y="202" class="small">任务指令</text>
    <text x="802" y="202" class="small">上下文 / 条件</text>
    <text x="934" y="202" class="small">结果预览（仅二维表）</text>
    <text x="494" y="178" font-size="25" fill="#6d28d9">▣</text>
    <text x="666" y="178" font-size="25" fill="#6d28d9">☷</text>
    <text x="820" y="178" font-size="25" fill="#6d28d9">◇</text>
    <text x="966" y="178" font-size="25" fill="#6d28d9">▧</text>
    <text x="1130" y="172" font-size="38" fill="#475569">●</text>
    <text x="1118" y="212" class="small">用户</text>
    <path d="M1068 173 L1110 173" class="plainLine"/>

    <rect x="406" y="248" width="710" height="470" class="greenBox"/>
    <text x="546" y="278" class="h3 green">桌面客户端通过模型 API 调用 LLM 服务（云端 / 企业模型服务）</text>
    <rect x="430" y="290" width="662" height="118" class="greenBox"/>
    <text x="604" y="335" class="h2 green">LLM 服务调用层</text>
    <text x="542" y="365" class="body">通过模型 API 调用 LLM，理解需求 → 选择工具 → 生成参数与执行计划 → 解释结果</text>
    <text x="594" y="342" font-size="38" fill="#2563eb">☁</text>

    <rect x="430" y="454" width="662" height="142" class="greenBox"/>
    <text x="604" y="482" class="h3 green">工具集（Tools）｜通过 Python + LLM Tool Calling 调用</text>
    <rect x="448" y="498" width="108" height="76" fill="#ffffff" stroke="#86efac" rx="8"/>
    <text x="466" y="522" class="small">FineBI Next</text><text x="462" y="546" class="small">数据读取 Tool</text><text x="466" y="566" class="tiny">读取云端数据</text>
    <rect x="566" y="498" width="108" height="76" fill="#ffffff" stroke="#86efac" rx="8"/>
    <text x="584" y="522" class="small">FineBI Next</text><text x="580" y="546" class="small">数据写入 Tool</text><text x="584" y="566" class="tiny">写入二维表</text>
    <rect x="684" y="498" width="124" height="76" fill="#ffffff" stroke="#86efac" rx="8"/>
    <text x="706" y="522" class="small">本地 Excel</text><text x="704" y="546" class="small">读写 Tool</text><text x="712" y="566" class="tiny">处理本地文件</text>
    <rect x="818" y="498" width="124" height="76" fill="#ffffff" stroke="#86efac" rx="8"/>
    <text x="844" y="522" class="small">数据处理</text><text x="856" y="546" class="small">Tool</text><text x="835" y="566" class="tiny">清洗/转换/聚合</text>
    <rect x="952" y="498" width="124" height="76" fill="#ffffff" stroke="#86efac" rx="8"/>
    <text x="978" y="522" class="small">SQL 执行</text><text x="990" y="546" class="small">Tool</text><text x="980" y="566" class="tiny">SQLite/DuckDB</text>

    <rect x="430" y="612" width="662" height="78" class="greenBox"/>
    <text x="658" y="646" class="h3">Python 运行环境（本地）</text>
    <text x="560" y="674" class="small">LangChain / LlamaIndex / Function Calling / 自定义框架，本地执行工具调用与数据整合</text>
    <text x="542" y="664" font-size="31" fill="#f59e0b">◆</text>
    <rect x="474" y="730" width="554" height="82" class="greenBox"/>
    <text x="642" y="760" class="h3 green">输出结果（仅标准二维表数据）</text>
    <text x="562" y="790" class="body">只输出标准二维表（行 × 列），不输出图表、仪表板、分析报告等可视化产物</text>
    <text x="508" y="784" font-size="40" fill="#2563eb">▦</text>

    <rect x="1268" y="112" width="214" height="276" class="orangeBox"/>
    <text x="1310" y="144" class="h3 orange">本地数据源（可选）</text>
    <rect x="1286" y="162" width="178" height="62" fill="#ffffff" stroke="#fdba74" rx="8"/>
    <text x="1336" y="188" class="body">本地 Excel 文件</text><text x="1336" y="210" class="small">(.xlsx / .xls)</text><text x="1300" y="204" font-size="33" fill="#16a34a">▣</text>
    <rect x="1286" y="234" width="178" height="62" fill="#ffffff" stroke="#fdba74" rx="8"/>
    <text x="1336" y="260" class="body">本地数据库</text><text x="1336" y="282" class="small">(SQLite / DuckDB 等)</text><text x="1300" y="275" font-size="33" fill="#475569">◉</text>
    <rect x="1286" y="306" width="178" height="62" fill="#ffffff" stroke="#fdba74" rx="8"/>
    <text x="1336" y="332" class="body">本地文件</text><text x="1336" y="354" class="small">(CSV / JSON / Parquet)</text><text x="1300" y="347" font-size="33" fill="#f97316">▤</text>

    <rect x="1266" y="438" width="218" height="284" class="box"/>
    <text x="1318" y="468" class="h3 blue">处理流程（本地）</text>
    <rect x="1290" y="494" width="168" height="36" fill="#ffffff" stroke="#bfdbfe" rx="7"/><text x="1346" y="518" class="body">数据清洗</text>
    <rect x="1290" y="542" width="168" height="36" fill="#ffffff" stroke="#bfdbfe" rx="7"/><text x="1346" y="566" class="body">数据转换</text>
    <rect x="1290" y="590" width="168" height="36" fill="#ffffff" stroke="#bfdbfe" rx="7"/><text x="1346" y="614" class="body">字段计算</text>
    <rect x="1290" y="638" width="168" height="36" fill="#ffffff" stroke="#bfdbfe" rx="7"/><text x="1346" y="662" class="body">聚合汇总</text>
    <rect x="1290" y="686" width="168" height="36" fill="#ffffff" stroke="#bfdbfe" rx="7"/><text x="1346" y="710" class="body">数据校验</text>

    <path d="M310 310 L388 310" class="blueLine"/>
    <text x="304" y="278" class="small blue">1. 读取数据</text><text x="304" y="298" class="small blue">（通过个人 API）</text>
    <path d="M1116 328 L1268 328" class="greenLine"/>
    <text x="1138" y="302" class="small green">2. 读取本地数据</text><text x="1138" y="322" class="small green">（通过 Tools）</text>
    <path d="M1116 558 L1266 558" class="greenLine"/>
    <text x="1138" y="528" class="small green">3. 数据处理与分析</text><text x="1138" y="548" class="small green">（Tools + LLM）</text>
    <path d="M752 812 L752 846" class="blueLine"/>

    <rect x="300" y="846" width="900" height="58" class="dash"/>
    <text x="614" y="878" class="h3 blue">数据闭环（Data Closed Loop）</text>
    <text x="378" y="898" class="small">数据获取 → 本地客户端处理 → 输出标准二维表 → 回写云端 → 云端可视化与应用</text>
    <path d="M474 772 L148 772 L148 696" class="blueLine"/>
    <text x="284" y="746" class="small blue">5. 推送结果数据</text><text x="284" y="766" class="small blue">（通过个人 API 写入）</text>

    <rect x="20" y="766" width="244" height="118" fill="#ffffff" stroke="#cbd5e1" rx="10"/>
    <text x="36" y="796" class="small blue">云端负责：可视化与应用</text>
    <text x="36" y="824" class="small">• 制作图表 / 仪表板 / 报表</text>
    <text x="36" y="852" class="small">• 数据发布与共享</text>
    <text x="36" y="880" class="small">• 权限与协作发布</text>
    <rect x="1258" y="766" width="220" height="118" fill="#ffffff" stroke="#bfdbfe" rx="10"/>
    <text x="1284" y="796" class="small blue">4. 写回后可在 FineBI Next 中使用</text>
    <text x="1284" y="830" class="small">• 基于写回数据建模</text>
    <text x="1284" y="856" class="small">• 制作图表 / 仪表板 / 报表</text>
    <text x="1284" y="882" class="small">• 发布共享与协作</text>
  </g>
</svg>
