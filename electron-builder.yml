appId: com.sophron.app
productName: sophron cowork
copyright: Copyright © 2026 sophron

directories:
  output: release/sophron
  buildResources: resources

npmRebuild: true
afterPack: ./scripts/after-pack.js
afterAllArtifactBuild: ./scripts/compress-dmg.js

publish:
  - provider: generic
    url: https://download.sophron.ai/updates/stable

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - node_modules/@img/**/*
  - node_modules/better-sqlite3/**/*
  - node_modules/@duckdb/**/*
  - node_modules/@anthropic-ai/sdk/**/*
  - node_modules/@larksuiteoapi/**/*
  - node_modules/openai/**/*
  - node_modules/@modelcontextprotocol/**/*
  - node_modules/chokidar/**/*
  - node_modules/archiver/**/*
  - node_modules/ngrok/**/*
  - node_modules/ws/**/*
  - node_modules/glob/**/*
  - node_modules/dotenv/**/*
  - node_modules/electron-updater/**/*
  - node_modules/builder-util-runtime/**/*
  - node_modules/fs-extra/**/*
  - node_modules/js-yaml/**/*
  - node_modules/lazy-val/**/*
  - node_modules/lodash.escaperegexp/**/*
  - node_modules/lodash.isequal/**/*
  - node_modules/semver/**/*
  - node_modules/tiny-typed-emitter/**/*
  - node_modules/bufferutil/**/*
  - node_modules/utf-8-validate/**/*
  # Exclude non-essential files from node_modules to reduce bundle size
  - '!**/*.js.map'
  - '!**/*.mjs.map'
  - '!**/*.d.ts.map'
  - '!**/*.mts.map'
  - '!**/*.d.ts'
  - '!**/*.ts'
  - '!**/README.md'
  - '!**/LICENSE'
  - '!**/LICENSE.md'
  - '!**/.npmignore'
  - '!**/.eslintrc*'
  - '!**/tsconfig.json'

# MCP servers and platform-specific resources are declared in each platform's
# extraResources section below (win/mac/linux).

# Skills are extracted via extraResources (per-platform) to avoid asar symlink issues.
# Sharp native modules must also be unpacked for image processing.
# Note: MCP servers are bundled with esbuild (all deps inlined), so no need to unpack MCP SDK
asarUnpack:
  - node_modules/@img/**/*.node
  - node_modules/@img/**/*.dll
  - node_modules/@img/**/*.dylib
  - node_modules/@img/**/*.so
  - node_modules/better-sqlite3/**/*.node
  - node_modules/@duckdb/**/*.node
  - node_modules/@duckdb/**/*.dll
  - node_modules/@duckdb/**/*.dylib
  - node_modules/@duckdb/**/*.so
  - node_modules/bufferutil/**/*.node
  - node_modules/utf-8-validate/**/*.node

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: sophron-${version}-win-${arch}.${ext}
  signAndEditExecutable: false
  extraResources:
    - from: resources/icon.ico
      to: icon.ico
    - from: resources/icon-fold.ico
      to: icon-fold.ico
    - from: resources/tray-icon.ico
      to: tray-icon.ico
    - from: resources/tray-icon-fold.ico
      to: tray-icon-fold.ico
    - from: resources/tray-icon.png
      to: tray-icon.png
    - from: resources/tray-icon-fold.png
      to: tray-icon-fold.png
    - from: src/main/data/workflow/workflow-sandbox-runner.js
      to: workflow/workflow-sandbox-runner.js
    - from: .bundle-resources/mcp
      to: mcp
    - from: resources/node/win32-x64
      to: node
    - from: resources/node/win32-x64/node_modules/npm
      to: node/node_modules/npm
    - from: dist-wsl-agent
      to: wsl-agent
    - from: assets/skills
      to: skills

mac:
  minimumSystemVersion: '13.5'
  icon: resources/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  artifactName: sophron-${version}-mac-${arch}.${ext}
  identity: auto
  hardenedRuntime: true
  gatekeeperAssess: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    LSApplicationCategoryType: public.app-category.developer-tools
    NSScreenCaptureUsageDescription: 'sophron cowork needs screen recording access for GUI automation.'
    NSAccessibilityUsageDescription: 'sophron cowork needs accessibility access for GUI automation.'
  extraResources:
    - from: resources/icon.icns
      to: icon.icns
    - from: resources/icon-fold.icns
      to: icon-fold.icns
    - from: resources/icon-mac.png
      to: icon-mac.png
    - from: resources/icon-fold-mac.png
      to: icon-fold-mac.png
    - from: resources/tray-iconTemplate.png
      to: tray-iconTemplate.png
    - from: resources/tray-icon-foldTemplate.png
      to: tray-icon-foldTemplate.png
    - from: src/main/data/workflow/workflow-sandbox-runner.js
      to: workflow/workflow-sandbox-runner.js
    - from: .bundle-resources/mcp
      to: mcp
    - from: resources/node/darwin-${arch}
      to: node
    - from: resources/node/darwin-${arch}/lib/node_modules/npm
      to: node/lib/node_modules/npm
    # Bundled Python runtime + site-packages for GUI automation helpers (Pillow, pyobjc/Quartz)
    - from: resources/python/darwin-${arch}
      to: python
    # Bundled GUI helper tools (e.g. cliclick) to avoid relying on user-installed Homebrew tools
    - from: resources/tools/darwin-${arch}
      to: tools
    - from: dist-lima-agent
      to: lima-agent
    - from: assets/skills
      to: skills

linux:
  icon: resources/icon.png
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: sophron-${version}-linux-${arch}.${ext}
  extraResources:
    - from: resources/icon.png
      to: icon.png
    - from: resources/icon-fold.png
      to: icon-fold.png
    - from: resources/tray-icon.png
      to: tray-icon.png
    - from: resources/tray-icon-fold.png
      to: tray-icon-fold.png
    - from: src/main/data/workflow/workflow-sandbox-runner.js
      to: workflow/workflow-sandbox-runner.js
    - from: .bundle-resources/mcp
      to: mcp
    - from: resources/node/linux-x64
      to: node
    - from: resources/node/linux-x64/lib/node_modules/npm
      to: node/lib/node_modules/npm
    - from: resources/python/linux-${arch}
      to: python
    - from: assets/skills
      to: skills

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: installer.nsh
  warningsAsErrors: false
  # Preserve user config/history by default; offer explicit cleanup tooling instead of destructive uninstall.
  deleteAppDataOnUninstall: false

dmg:
  # Explicit size to avoid dmgbuild "No space left on device" for large apps.
  # The temporary writable DMG is auto-shrunk after copying, so this doesn't
  # affect final DMG size. Our ULMO compression hook further reduces it.
  size: '3g'
  window:
    width: 600
    height: 440
  contents:
    - x: 150
      y: 220
      name: 'sophron cowork.app'
    - x: 450
      y: 220
      type: link
      path: /Applications
      name: 'Applications'

extraMetadata:
  main: dist-electron/main/index.js
